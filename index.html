<!doctype html>
<html lang="hu" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Személyes költségkövető alkalmazás" />
    <title>Költségkövető</title>
    <script>
      // Elkerüli a villanást: a mentett téma alkalmazása még a CSS betöltése előtt.
      try {
        var t = localStorage.getItem('koltsegkoveto-theme')
        if (t === 'light') document.documentElement.classList.replace('dark', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
